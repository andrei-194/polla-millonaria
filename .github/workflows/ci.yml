name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests y validaciones
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_polla
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: polla_futbolera

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: polla_futbolera/requirements/development.txt

      - name: Instalar dependencias
        run: pip install -r requirements/development.txt

      - name: Verificar migraciones sin generar
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_polla
          SECRET_KEY: ci-only-insecure-key-not-used-in-prod
          FOOTBALL_API_KEY: ""
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_polla
          SECRET_KEY: ci-only-insecure-key-not-used-in-prod
          FOOTBALL_API_KEY: ""
        run: python manage.py migrate --noinput

      - name: Ejecutar suite de tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_polla
          SECRET_KEY: ci-only-insecure-key-not-used-in-prod
          FOOTBALL_API_KEY: ""
        run: python manage.py test tests --verbosity=2
