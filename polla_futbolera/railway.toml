[build]
builder = "DOCKERFILE"
dockerfilePath = "polla_futbolera/docker/Dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120'"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
