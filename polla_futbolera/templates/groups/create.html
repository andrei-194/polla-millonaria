{% extends "base.html" %}

{% block title %}Crear Grupo — Polla Futbolera{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Crear nuevo grupo</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'groups:create' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.name.id_for_label }}" class="form-label fw-semibold">
                            Nombre del grupo
                        </label>
                        <input
                            type="text"
                            class="form-control {% if form.name.errors %}is-invalid{% endif %}"
                            id="{{ form.name.id_for_label }}"
                            name="name"
                            value="{{ form.name.value|default:'' }}"
                            required
                            autofocus
                        >
                        {% for error in form.name.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                        {% endfor %}
                    </div>
                    <div class="mb-4">
                        <label for="{{ form.description.id_for_label }}" class="form-label fw-semibold">
                            Descripción <span class="text-muted fw-normal">(opcional)</span>
                        </label>
                        <textarea
                            class="form-control"
                            id="{{ form.description.id_for_label }}"
                            name="description"
                            rows="3"
                        >{{ form.description.value|default:'' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Crear grupo
                        </button>
                        <a href="{% url 'groups:list' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
