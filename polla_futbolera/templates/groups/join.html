{% extends "base.html" %}

{% block title %}Unirse a un Grupo — Polla Futbolera{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-door-open"></i> Unirse a un grupo</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Ingresa el código de invitación que te compartieron.</p>
                <form method="post" action="{% url 'groups:join' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="{{ form.invitation_code.id_for_label }}" class="form-label fw-semibold">
                            Código de invitación
                        </label>
                        <input
                            type="text"
                            class="form-control {% if form.invitation_code.errors %}is-invalid{% endif %}"
                            id="{{ form.invitation_code.id_for_label }}"
                            name="invitation_code"
                            value="{{ form.invitation_code.value|default:'' }}"
                            required
                            autofocus
                            placeholder="ej: abc123XY"
                        >
                        {% for error in form.invitation_code.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                        {% endfor %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Unirse
                        </button>
                        <a href="{% url 'groups:list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
