{% extends "base.html" %}

{% block title %}Invitar al Grupo — Polla Futbolera{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-share"></i> Invitar a {{ group.name }}</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-3">Comparte este enlace o código para que otros se unan al grupo.</p>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Código de invitación</label>
                    <div class="input-group">
                        <input
                            type="text"
                            class="form-control font-monospace"
                            value="{{ group.invitation_code }}"
                            id="invCode"
                            readonly
                        >
                        <button
                            class="btn btn-outline-secondary"
                            onclick="navigator.clipboard.writeText(document.getElementById('invCode').value)"
                            title="Copiar código"
                        >
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Enlace de invitación</label>
                    <div class="input-group">
                        <input
                            type="text"
                            class="form-control"
                            value="{{ invite_link }}"
                            id="invLink"
                            readonly
                        >
                        <button
                            class="btn btn-outline-secondary"
                            onclick="navigator.clipboard.writeText(document.getElementById('invLink').value)"
                            title="Copiar enlace"
                        >
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <form method="post" action="{% url 'groups:invite' slug=group.slug %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-arrow-repeat"></i> Regenerar código
                        </button>
                    </form>
                    <a href="{% url 'groups:detail' slug=group.slug %}" class="btn btn-outline-secondary">
                        Volver al grupo
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
