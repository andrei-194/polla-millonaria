{% extends "base.html" %}

{% block title %}Iniciar sesión — Polla Futbolera{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-box-arrow-in-right text-success"></i> Iniciar sesión
                </h2>
                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                            autofocus
                        >
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            Entrar
                        </button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">
                    ¿No tienes cuenta?
                    <a href="{% url 'accounts:register' %}" class="text-success fw-semibold">Regístrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
