{% extends "base.html" %}

{% block title %}Activar Torneo — Polla Futbolera{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Agregar torneo a {{ group.name }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Seleccionar torneo</label>
                        {% for tournament in tournaments %}
                        <div class="form-check mb-2">
                            <input
                                class="form-check-input"
                                type="radio"
                                name="tournament_id"
                                id="t_{{ tournament.id }}"
                                value="{{ tournament.id }}"
                                required
                            >
                            <label class="form-check-label" for="t_{{ tournament.id }}">
                                <strong>{{ tournament.name }}</strong>
                                <small class="text-muted">— {{ tournament.season }}</small>
                            </label>
                        </div>
                        {% empty %}
                        <p class="text-muted">No hay torneos activos disponibles.</p>
                        {% endfor %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Activar torneo
                        </button>
                        <a href="{% url 'groups:detail' slug=group.slug %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
